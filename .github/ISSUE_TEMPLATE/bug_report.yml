name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The demo, a self-hosted deployment (which version or commit), or local development.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove connection strings, tokens and personal data first.

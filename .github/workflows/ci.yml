name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A throwaway MongoDB for the *.integration.test.ts suites (MONGODB_TEST_URI).
    services:
      mongo:
        image: mongo:7@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unused files, exports and dependencies (knip.json).
      - name: Dead code
        run: npx knip

      - name: Test
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/assay_ci_test
        run: npm test

      # Replaces the build check Vercel previews used to give PRs; no secrets needed.
      - name: Build
        run: npm run build

      # The production dependency inventory, with licenses, for each commit on main.
      - name: SBOM
        if: github.event_name == 'push'
        run: npm sbom --sbom-format cyclonedx --omit dev > "$RUNNER_TEMP/sbom.cdx.json"

      - name: Upload SBOM
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom.cdx.json
          retention-days: 90

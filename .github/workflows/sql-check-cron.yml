name: Scheduled SQL checks

on:
  schedule:
    # Every 30 minutes. The runner runs each check at most once per cron slot
    # (scripts/run-all-scripts.ts with src/lib/scheduling/due-slot.ts), so
    # GitHub's late or repeated triggers are safe.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "scheduled: checks whose slot is due; all: every check now"
        required: false
        default: scheduled
        type: choice
        options:
          - scheduled
          - all

permissions:
  contents: read

# Never run two batches at once; a new trigger waits for the running one.
concurrency:
  group: sql-checks
  cancel-in-progress: false

jobs:
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run checks
        # Secrets go straight into the environment; nothing writes or prints them.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CA_CERT_BLOB_URL: ${{ secrets.CA_CERT_BLOB_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EXECUTION_MODE: ${{ github.event.inputs.execution_mode || 'scheduled' }}
          NODE_ENV: production
        run: |
          # Forks and fresh copies have no secrets yet: skip instead of failing.
          if [ -z "$DATABASE_URL" ] || [ -z "$MONGODB_URI" ]; then
            echo "::notice::DATABASE_URL or MONGODB_URI is not set; skipping scheduled checks."
            exit 0
          fi
          npx ts-node scripts/run-all-scripts.ts "$EXECUTION_MODE"

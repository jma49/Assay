name: Scheduled SQL checks

on:
  schedule:
    # Every 30 minutes. The runner runs each check at most once per cron slot
    # (scripts/run-all-scripts.ts with src/lib/scheduling/due-slot.ts), so
    # GitHub's late or repeated triggers are safe.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "scheduled: checks whose slot is due; all: every check now"
        required: false
        default: scheduled
        type: choice
        options:
          - scheduled
          - all

permissions:
  contents: read

# Never run two batches at once; a new trigger waits for the running one.
concurrency:
  group: sql-checks
  cancel-in-progress: false

jobs:
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run checks
        # Secrets go straight into the environment; nothing writes or prints them.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # The same settings the app has on Vercel, so a scheduled run
          # behaves like one started in the app. Optional: an unset secret or
          # variable arrives empty, which the app treats as unset.
          CA_CERT_BLOB_URL: ${{ secrets.CA_CERT_BLOB_URL }}
          CLIENT_CERT_BLOB_URL: ${{ secrets.CLIENT_CERT_BLOB_URL }}
          CLIENT_KEY_BLOB_URL: ${{ secrets.CLIENT_KEY_BLOB_URL }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
          CHECK_TIMEOUT_MS: ${{ vars.CHECK_TIMEOUT_MS }}
          CHECK_CONCURRENCY: ${{ vars.CHECK_CONCURRENCY }}
          PG_POOL_MAX: ${{ vars.PG_POOL_MAX }}
          RUN_RETENTION_DAYS: ${{ vars.RUN_RETENTION_DAYS }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EXECUTION_MODE: ${{ github.event.inputs.execution_mode || 'scheduled' }}
          NODE_ENV: production
        run: |
          # Forks and fresh copies have no secrets yet: skip instead of failing.
          if [ -z "$DATABASE_URL" ] || [ -z "$MONGODB_URI" ]; then
            echo "::notice::DATABASE_URL or MONGODB_URI is not set; skipping scheduled checks."
            exit 0
          fi
          npx tsx scripts/run-all-scripts.ts "$EXECUTION_MODE"

      - name: Send alerts
        # Alerts are sent by the app, which holds the channel secrets; this
        # only asks it to run the outbox. Runs even when a check failed.
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET is not set; alerts go out on the next run in the app."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/notifications/dispatch"

name: Manual SQL Script Trigger

on:
  workflow_dispatch:
    inputs:
      script_id:
        description: "The ID of the check to run (its script ID in the app)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-manual-sql-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run SQL Check Script
        # Secrets go straight into the environment; nothing writes or prints them.
        # Action logs of this public repo are public.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NODE_ENV: production
          # Inputs go through env, not ${{ }} in the script, so they cannot inject shell.
          SCRIPT_ID: ${{ github.event.inputs.script_id }}
        run: npx tsx scripts/run-sql.ts "$SCRIPT_ID"

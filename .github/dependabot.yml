version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the production runtime (Node 24 on Vercel), not the
      # latest Node release: newer types describe APIs the runtime lacks. Raise
      # this bound together with the Vercel Node version and CI's setup-node.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # eslint-config-next 16 bundles eslint-plugin-react, -import and
      # -jsx-a11y, which accept ESLint <= 9; eslint-plugin-react crashes on
      # ESLint 10. Drop this once an eslint-config-next release supports 10.
      - dependency-name: "eslint"
        versions: [">=10"]
      # TypeScript 7 (the native compiler) has no JavaScript API yet, and
      # typescript-eslint, which eslint-config-next uses, refuses to load
      # with it. Revisit when a typescript-eslint release accepts TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

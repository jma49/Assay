  <ellipse cx="64" cy="118" rx="46" ry="6" fill="url(#shadow)"/>
  <path d="M12 86 L96 70 L116 106 L32 122 Z" fill="url(#paper)" stroke="#8e98a6" stroke-width="1.8" stroke-linejoin="round"/>

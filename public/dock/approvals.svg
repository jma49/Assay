    <radialGradient id="knob" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#e9b98a"/><stop offset="0.55" stop-color="#a8652f"/><stop offset="1" stop-color="#6d3a14"/></radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a4318"/><stop offset="0.45" stop-color="#c98a52"/><stop offset="1" stop-color="#6d3a14"/></linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d9d9"/><stop offset="0.5" stop-color="#9a9a9a"/><stop offset="1" stop-color="#6a6a6a"/></linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2463c"/><stop offset="1" stop-color="#9c1a14"/></linearGradient>
